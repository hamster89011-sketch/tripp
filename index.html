<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 여행 일정 플래너</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans KR & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        /* 스크롤바 숨기기 (모바일 가로 스크롤용) */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 부드러운 페이드인 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-800 antialiased pb-12">

    <!-- 상단 앱 바 -->
    <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-200/80 px-4 py-3.5">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-sm">
                    <i class="fa-solid fa-plane-departure text-sm"></i>
                </div>
                <h1 class="text-lg font-bold tracking-tight text-slate-900">AI 트립 플래너</h1>
            </div>
            <span class="text-xs font-medium px-2.5 py-1 bg-blue-50 text-blue-600 rounded-full border border-blue-100">
                Beta
            </span>
        </div>
    </header>

    <!-- 메인 컨테이너 (모바일 최적화 너비) -->
    <main class="max-w-md mx-auto px-4 pt-5 space-y-6">

        <!-- 입력 폼 카드 -->
        <section class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-5">
            <div>
                <h2 class="text-base font-bold text-slate-900 mb-1">어디로 떠나시나요?</h2>
                <p class="text-xs text-slate-500">조건을 입력하면 AI가 맞춤형 일정을 만들어드려요.</p>
            </div>

            <!-- 1. 여행지 입력 -->
            <div class="space-y-1.5">
                <label for="destination" class="block text-xs font-semibold text-slate-700">여행지</label>
                <div class="relative">
                    <i class="fa-solid fa-location-dot absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="destination" placeholder="예: 제주도, 도쿄, 강릉, 파리" value="제주도"
                        class="w-full pl-9 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                </div>
            </div>

            <!-- 2. 여행 기간 선택 -->
            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-slate-700">여행 기간</label>
                <div class="grid grid-cols-4 gap-2" id="duration-group">
                    <button type="button" data-value="1박 2일" class="duration-btn py-2.5 px-2 rounded-xl text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">1박 2일</button>
                    <button type="button" data-value="2박 3일" class="duration-btn py-2.5 px-2 rounded-xl text-xs font-semibold border border-blue-600 bg-blue-600 text-white shadow-sm transition-all">2박 3일</button>
                    <button type="button" data-value="3박 4일" class="duration-btn py-2.5 px-2 rounded-xl text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">3박 4일</button>
                    <button type="button" data-value="4박 5일" class="duration-btn py-2.5 px-2 rounded-xl text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">4박 5일</button>
                </div>
            </div>

            <!-- 3. 동행자 선택 -->
            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-slate-700">누구와 함께 가나요?</label>
                <div class="flex flex-wrap gap-2" id="companion-group">
                    <button type="button" data-value="혼자서" class="companion-btn px-3.5 py-2 rounded-full text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">🧍 혼자서</button>
                    <button type="button" data-value="연인과" class="companion-btn px-3.5 py-2 rounded-full text-xs font-semibold border border-blue-600 bg-blue-50 text-blue-700 transition-all">💑 연인과</button>
                    <button type="button" data-value="친구들과" class="companion-btn px-3.5 py-2 rounded-full text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">👯 친구들과</button>
                    <button type="button" data-value="부모님과" class="companion-btn px-3.5 py-2 rounded-full text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">👨‍👩‍👧 부모님과</button>
                    <button type="button" data-value="아이와" class="companion-btn px-3.5 py-2 rounded-full text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">👶 아이와</button>
                </div>
            </div>

            <!-- 4. 여행 루트 스타일 선택 -->
            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-slate-700">어떤 루트를 원하시나요?</label>
                <div class="grid grid-cols-3 gap-2" id="route-group">
                    <button type="button" data-value="가성비 루트" class="route-btn py-2.5 px-2 rounded-xl text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">💸 가성비</button>
                    <button type="button" data-value="럭셔리 루트" class="route-btn py-2.5 px-2 rounded-xl text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">✨ 럭셔리</button>
                    <button type="button" data-value="현지인 루트" class="route-btn py-2.5 px-2 rounded-xl text-xs font-semibold border border-blue-600 bg-blue-50 text-blue-700 transition-all">🧭 현지인 추천</button>
                </div>
            </div>

            <!-- 5. 관심사 (다중 선택) -->
            <div class="space-y-1.5">
                <div class="flex justify-between items-center">
                    <label class="block text-xs font-semibold text-slate-700">관심사 <span class="text-slate-400 font-normal">(중복 가능)</span></label>
                </div>
                <div class="flex flex-wrap gap-2" id="interest-group">
                    <button type="button" data-value="맛집 탐방" class="interest-btn px-3.5 py-2 rounded-full text-xs font-semibold border border-blue-600 bg-blue-50 text-blue-700 transition-all">🍽️ 맛집 탐방</button>
                    <button type="button" data-value="감성 카페" class="interest-btn px-3.5 py-2 rounded-full text-xs font-semibold border border-blue-600 bg-blue-50 text-blue-700 transition-all">☕ 감성 카페</button>
                    <button type="button" data-value="자연/힐링" class="interest-btn px-3.5 py-2 rounded-full text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">🌿 자연/힐링</button>
                    <button type="button" data-value="액티비티" class="interest-btn px-3.5 py-2 rounded-full text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">🏄 액티비티</button>
                    <button type="button" data-value="인생샷 명소" class="interest-btn px-3.5 py-2 rounded-full text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">📸 인생샷 명소</button>
                    <button type="button" data-value="문화/예술" class="interest-btn px-3.5 py-2 rounded-full text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">🎨 문화/예술</button>
                    <button type="button" data-value="쇼핑" class="interest-btn px-3.5 py-2 rounded-full text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">🛍️ 쇼핑</button>
                </div>
            </div>

            <!-- 생성 버튼 -->
            <button type="button" id="generate-btn"
                class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold text-sm rounded-2xl shadow-md shadow-blue-600/20 flex items-center justify-center gap-2 transition-all">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>맞춤 여행 일정 만들기</span>
            </button>
        </section>

        <!-- 알림/토스트 메시지 영역 (alert 대체용) -->
        <div id="toast-message" class="hidden bg-amber-50 border border-amber-200 text-amber-800 px-4 py-3 rounded-2xl text-xs flex items-start gap-2.5 shadow-sm">
            <i class="fa-solid fa-circle-info text-amber-500 mt-0.5"></i>
            <div id="toast-text" class="leading-relaxed"></div>
        </div>

        <!-- 로딩 인디케이터 -->
        <div id="loading-state" class="hidden py-12 text-center space-y-3">
            <div class="inline-block w-10 h-10 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
            <p class="text-sm font-semibold text-slate-700">AI가 최적의 동선을 짜고 있어요...</p>
            <p class="text-xs text-slate-400">잠시만 기다려주세요 (약 3~5초 소요)</p>
        </div>

        <!-- 결과 출력 영역 (일정 카드) -->
        <section id="result-section" class="space-y-4">
            <!-- 헤더 정보 -->
            <div class="flex items-center justify-between px-1">
                <div>
                    <div class="flex items-center gap-1.5">
                        <h3 id="result-title" class="text-base font-bold text-slate-900">제주도 2박 3일 추천 일정</h3>
                        <span id="mock-badge" class="text-[10px] font-semibold px-2 py-0.5 bg-slate-200 text-slate-600 rounded-md">예시 데이터</span>
                    </div>
                    <p id="result-subtitle" class="text-xs text-slate-500 mt-0.5">연인과 함께하는 맛집 탐방 · 감성 카페 코스</p>
                </div>
                <button type="button" id="copy-btn" class="p-2 text-slate-500 hover:text-blue-600 bg-white border border-slate-200 rounded-xl shadow-sm active:scale-95 transition-all" title="일정 복사하기">
                    <i class="fa-regular fa-copy text-sm"></i>
                </button>
            </div>

            <!-- 일자별 카드 컨테이너 -->
            <div id="cards-container" class="space-y-4">
                <!-- 자바스크립트로 카드가 동적 렌더링 됩니다 -->
            </div>
        </section>

    </main>

    <script>
        // --- 상태 관리 ---
        const state = {
            destination: '제주도',
            duration: '2박 3일',
            companion: '연인과',
            routeType: '현지인 루트',
            interests: ['맛집 탐방', '감성 카페']
        };

        // --- 예시 일정 데이터 (API 연결 전 기본 표시 및 폴백용) ---
        const getMockItinerary = (dest, duration, companion, routeType, interests) => {
            const targetDest = dest.trim() || '제주도';
            const interestStr = interests.length > 0 ? interests.join(', ') : '힐링';

            // 기간에 따른 일수 계산
            let daysCount = 3;
            if (duration.includes('1박')) daysCount = 2;
            else if (duration.includes('2박')) daysCount = 3;
            else if (duration.includes('3박')) daysCount = 4;
            else if (duration.includes('4박')) daysCount = 5;

            // 루트 스타일별 맞춤 문구 및 예상 경비 설정
            let stylePrefix = '로컬 찐';
            let budgetData = {
                totalRange: `약 ${daysCount * 11}만원 ~ ${daysCount * 15}만원`,
                breakdown: [
                    { category: '식비/카페', estimate: `약 ${daysCount * 4}만원 ~ ${daysCount * 5.5}만원`, note: '로컬 맛집 및 디저트' },
                    { category: '숙박비', estimate: `약 ${(daysCount - 1) * 5}만원 ~ ${(daysCount - 1) * 7}만원`, note: '1인 분담 기준 (게스트하우스/비즈니스)' },
                    { category: '교통/입장료', estimate: `약 ${daysCount * 2}만원 ~ ${daysCount * 2.5}만원`, note: '대중교통 및 관광지' }
                ],
                note: '현지인 루트 기준 1인 예상 경비이며, 시즌 및 방문 매장 사정에 따라 변동될 수 있습니다.'
            };

            if (routeType === '가성비 루트') {
                stylePrefix = '알뜰 가성비';
                budgetData = {
                    totalRange: `약 ${daysCount * 7}만원 ~ ${daysCount * 10}만원`,
                    breakdown: [
                        { category: '식비/카페', estimate: `약 ${daysCount * 2.5}만원 ~ ${daysCount * 3.5}만원`, note: '가성비 백반 및 분식 위주' },
                        { category: '숙박비', estimate: `약 ${(daysCount - 1) * 3.5}만원 ~ ${(daysCount - 1) * 5}만원`, note: '1인 분담 기준 (실속형 숙소)' },
                        { category: '교통/입장료', estimate: `약 ${daysCount * 1}만원 ~ ${daysCount * 1.5}만원`, note: '도보·버스 및 무료 명소' }
                    ],
                    note: '가성비 루트 기준 1인 예상 경비이며, 실제 요금은 현지 사정에 따라 달라질 수 있습니다.'
                };
            } else if (routeType === '럭셔리 루트') {
                stylePrefix = '프리미엄 파인';
                budgetData = {
                    totalRange: `약 ${daysCount * 28}만원 ~ ${daysCount * 42}만원`,
                    breakdown: [
                        { category: '식비/카페', estimate: `약 ${daysCount * 10}만원 ~ ${daysCount * 15}만원`, note: '파인 다이닝 및 오션뷰 라운지' },
                        { category: '숙박비', estimate: `약 ${(daysCount - 1) * 15}만원 ~ ${(daysCount - 1) * 22}만원`, note: '1인 분담 기준 (5성급 호텔/리조트)' },
                        { category: '교통/투어', estimate: `약 ${daysCount * 3}만원 ~ ${daysCount * 5}만원`, note: '렌터카/택시 및 프라이빗 체험' }
                    ],
                    note: '럭셔리 루트 기준 1인 예상 경비이며, 예약 시기 및 옵션에 따라 변동 폭이 큽니다.'
                };
            }

            const sampleDays = [
                {
                    day: 1,
                    theme: `${targetDest} 도착 & ${stylePrefix} 감성 시작`,
                    activities: [
                        { time: '11:30', title: `${targetDest} 로컬 웰컴 런치`, desc: `${companion} 함께 즐기기 좋은 현지인 추천 대표 메뉴로 여행 시작`, tag: '맛집 탐방' },
                        { time: '14:00', title: `${targetDest} 시그니처 뷰 카페`, desc: `여유로운 티타임과 사진 남기기 좋은 공간 (방문 전 운영 시간 확인 권장)`, tag: '감성 카페' },
                        { time: '16:30', title: `${targetDest} 대표 산책 명소`, desc: `선선한 바람을 맞으며 걷기 좋은 대표 힐링 스팟`, tag: '자연/힐링' },
                        { time: '19:00', title: `${targetDest} 야경 및 저녁 식사`, desc: `분위기 좋은 로컬 다이닝에서 하루 마무리`, tag: '맛집 탐방' }
                    ]
                },
                {
                    day: 2,
                    theme: `${interestStr} 중심 핵심 코스`,
                    activities: [
                        { time: '09:30', title: `현지인 단골 브런치 & 모닝 커피`, desc: `상쾌한 아침을 여는 동네 숨은 베이커리 카페`, tag: '감성 카페' },
                        { time: '11:30', title: `${targetDest} 핵심 테마 스팟`, desc: `${companion} 취향을 저격하는 대표 볼거리와 체험 코스`, tag: interests[0] || '인생샷 명소' },
                        { time: '14:30', title: `${targetDest} 인기 로컬 맛집`, desc: `웨이팅이 있을 수 있으니 방문 전 현장 상황 확인 권장`, tag: '맛집 탐방' },
                        { time: '17:00', title: `노을 명소 드라이브 & 산책`, desc: `해 질 녘 가장 아름다운 풍경을 감상할 수 있는 포인트`, tag: '인생샷 명소' }
                    ]
                },
                {
                    day: 3,
                    theme: `여유로운 마무리 & 기념품 쇼핑`,
                    activities: [
                        { time: '10:00', title: `체크아웃 및 아점 식사`, desc: `속이 편안한 로컬 아침 식사 메뉴 추천`, tag: '맛집 탐방' },
                        { time: '12:30', title: `${targetDest} 소품샵 & 로컬 마켓`, desc: `여행의 추억을 간직할 기념품 및 특산품 구경`, tag: '쇼핑' },
                        { time: '15:00', title: `공항/역 근처 마지막 티타임`, desc: `출발 전 여유롭게 일정을 정리하는 디저트 타임`, tag: '감성 카페' }
                    ]
                },
                {
                    day: 4,
                    theme: `근교 소도시 & 히든 스팟 탐험`,
                    activities: [
                        { time: '10:30', title: `${targetDest} 근교 드라이브 코스`, desc: `한적한 풍경을 따라 이동하는 여유로운 오전 일정`, tag: '자연/힐링' },
                        { time: '13:00', title: `숨은 골목 노포 맛집`, desc: `오랜 세월 사랑받아온 현지인 찐 단골 식당`, tag: '맛집 탐방' },
                        { time: '16:00', title: `문화 예술 공간 관람`, desc: `지역 특색이 담긴 전시 및 갤러리 산책`, tag: '문화/예술' }
                    ]
                },
                {
                    day: 5,
                    theme: `아쉬움을 달래는 마지막 힐링`,
                    activities: [
                        { time: '10:00', title: `호텔/숙소 주변 아침 산책`, desc: `조용한 아침 공기를 마시며 즐기는 마지막 산책`, tag: '자연/힐링' },
                        { time: '12:30', title: `여행 피날레 특식`, desc: `${targetDest}에서 꼭 먹고 가야 할 마지막 한 끼`, tag: '맛집 탐방' }
                    ]
                }
            ];

            const mustEatData = [
                {
                    name: `${targetDest} 원조 로컬 식당`,
                    signature: `대표 시그니처 한상 차림`,
                    reason: `${routeType} 여행자에게 딱 맞는 현지인 추천 필수 방문지 (방문 전 영업시간 확인 권장)`
                },
                {
                    name: `${targetDest} 골목 노포 국수/탕반`,
                    signature: `깊은 맛의 현지 전통 메뉴`,
                    reason: `아침이나 점심 식사로 부담 없이 즐기기 좋은 로컬 찐 맛집`
                },
                {
                    name: `${targetDest} 오션/시티뷰 디저트 로스터리`,
                    signature: `수제 시그니처 디저트 & 스페셜티 커피`,
                    reason: `${companion} 함께 인생샷과 휴식을 동시에 챙길 수 있는 공간`
                }
            ];

            return {
                title: `${targetDest} ${duration} 추천 일정`,
                subtitle: `${companion} 함께하는 ${routeType} (${interestStr})`,
                days: sampleDays.slice(0, daysCount),
                mustEat: mustEatData,
                budget: budgetData
            };
        };

        // --- UI 헬퍼 함수 ---
        const showToast = (msg, isError = false) => {
            const toast = document.getElementById('toast-message');
            const toastText = document.getElementById('toast-text');
            toastText.textContent = msg;
            toast.className = isError
                ? 'bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-2xl text-xs flex items-start gap-2.5 shadow-sm animate-fade-in'
                : 'bg-amber-50 border border-amber-200 text-amber-800 px-4 py-3 rounded-2xl text-xs flex items-start gap-2.5 shadow-sm animate-fade-in';
            toast.classList.remove('hidden');
        };

        const hideToast = () => {
            document.getElementById('toast-message').classList.add('hidden');
        };

        // --- 버튼 그룹 이벤트 연결 (단일 선택) ---
        function setupSingleSelect(selector, stateKey, activeClasses, inactiveClasses) {
            const buttons = document.querySelectorAll(selector);
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    buttons.forEach(b => {
                        b.classList.remove(...activeClasses);
                        b.classList.add(...inactiveClasses);
                    });
                    btn.classList.remove(...inactiveClasses);
                    btn.classList.add(...activeClasses);
                    state[stateKey] = btn.dataset.value;
                });
            });
        }

        // 기간 버튼 (파란 배경 스타일)
        setupSingleSelect(
            '.duration-btn',
            'duration',
            ['border-blue-600', 'bg-blue-600', 'text-white', 'font-semibold', 'shadow-sm'],
            ['border-slate-200', 'bg-slate-50', 'text-slate-600', 'font-medium']
        );

        // 동행자 버튼 (연한 파란 칩 스타일)
        setupSingleSelect(
            '.companion-btn',
            'companion',
            ['border-blue-600', 'bg-blue-50', 'text-blue-700', 'font-semibold'],
            ['border-slate-200', 'bg-slate-50', 'text-slate-600', 'font-medium']
        );

        // 루트 스타일 버튼 (연한 파란 칩 스타일)
        setupSingleSelect(
            '.route-btn',
            'routeType',
            ['border-blue-600', 'bg-blue-50', 'text-blue-700', 'font-semibold'],
            ['border-slate-200', 'bg-slate-50', 'text-slate-600', 'font-medium']
        );

        // 관심사 버튼 (다중 선택 토글)
        const interestButtons = document.querySelectorAll('.interest-btn');
        interestButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.dataset.value;
                const idx = state.interests.indexOf(val);
                if (idx > -1) {
                    state.interests.splice(idx, 1);
                    btn.classList.remove('border-blue-600', 'bg-blue-50', 'text-blue-700', 'font-semibold');
                    btn.classList.add('border-slate-200', 'bg-slate-50', 'text-slate-600', 'font-medium');
                } else {
                    state.interests.push(val);
                    btn.classList.remove('border-slate-200', 'bg-slate-50', 'text-slate-600', 'font-medium');
                    btn.classList.add('border-blue-600', 'bg-blue-50', 'text-blue-700', 'font-semibold');
                }
            });
        });

        // --- 일정 카드 렌더링 함수 ---
        let currentRenderedData = null;

        function renderItinerary(data, isMock = false) {
            currentRenderedData = data;
            document.getElementById('result-title').textContent = data.title || '맞춤 여행 일정';
            document.getElementById('result-subtitle').textContent = data.subtitle || '';

            const mockBadge = document.getElementById('mock-badge');
            if (isMock) {
                mockBadge.textContent = '예시 데이터';
                mockBadge.className = 'text-[10px] font-semibold px-2 py-0.5 bg-slate-200 text-slate-600 rounded-md';
            } else {
                mockBadge.textContent = 'AI 생성 완료';
                mockBadge.className = 'text-[10px] font-semibold px-2 py-0.5 bg-blue-100 text-blue-700 rounded-md';
            }

            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            // 1. 일자별 일정 카드 렌더링
            (data.days || []).forEach((dayItem, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-4 animate-fade-in';
                card.style.animationDelay = `${index * 0.08}s`;

                const activitiesHtml = (dayItem.activities || []).map((act, actIdx) => {
                    const isLast = actIdx === dayItem.activities.length - 1;
                    return `
                        <div class="relative pl-6 ${isLast ? '' : 'pb-5'}">
                            ${!isLast ? '<div class="absolute left-[7px] top-3 bottom-0 w-[1.5px] bg-slate-200"></div>' : ''}
                            <div class="absolute left-0 top-1.5 w-4 h-4 rounded-full bg-blue-50 border-2 border-blue-600"></div>
                            <div class="flex items-center justify-between gap-2 mb-1">
                                <span class="text-xs font-bold text-blue-600">${act.time || ''}</span>
                                ${act.tag ? `<span class="text-[10px] font-medium px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full">${act.tag}</span>` : ''}
                            </div>
                            <h4 class="text-sm font-bold text-slate-800">${act.title || ''}</h4>
                            <p class="text-xs text-slate-500 mt-1 leading-relaxed">${act.desc || ''}</p>
                        </div>
                    `;
                }).join('');

                card.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-1 bg-blue-600 text-white text-xs font-bold rounded-xl">DAY ${dayItem.day}</span>
                            <h4 class="text-sm font-bold text-slate-900">${dayItem.theme || ''}</h4>
                        </div>
                    </div>
                    <div class="pt-1">
                        ${activitiesHtml}
                    </div>
                `;
                container.appendChild(card);
            });

            // 2. 꼭 가야 하는 핵심 맛집 카드 렌더링
            if (data.mustEat && data.mustEat.length > 0) {
                const eatCard = document.createElement('div');
                eatCard.className = 'bg-white rounded-3xl p-5 shadow-sm border border-orange-100 space-y-3.5 animate-fade-in';
                const eatListHtml = data.mustEat.map(item => `
                    <div class="p-3.5 rounded-2xl bg-orange-50/60 border border-orange-100/80 space-y-1">
                        <div class="flex items-center justify-between gap-2">
                            <h5 class="text-sm font-bold text-slate-900">${item.name}</h5>
                            <span class="text-[10px] font-semibold px-2 py-0.5 bg-orange-100 text-orange-700 rounded-full shrink-0">${item.signature}</span>
                        </div>
                        <p class="text-xs text-slate-600 leading-relaxed">${item.reason}</p>
                    </div>
                `).join('');

                eatCard.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-7 h-7 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center text-xs">
                            <i class="fa-solid fa-utensils"></i>
                        </span>
                        <div>
                            <h4 class="text-sm font-bold text-slate-900">꼭 가야 하는 핵심 맛집</h4>
                            <p class="text-[11px] text-slate-400">선택한 루트 스타일에 맞춘 엄선 리스트</p>
                        </div>
                    </div>
                    <div class="space-y-2.5">${eatListHtml}</div>
                `;
                container.appendChild(eatCard);
            }

            // 3. 총 예상 경비 카드 렌더링
            if (data.budget) {
                const budgetCard = document.createElement('div');
                budgetCard.className = 'bg-slate-900 text-white rounded-3xl p-5 shadow-md space-y-4 animate-fade-in';
                const breakdownHtml = (data.budget.breakdown || []).map(b => `
                    <div class="flex items-center justify-between text-xs py-1.5 border-b border-slate-800 last:border-none">
                        <div>
                            <span class="font-semibold text-slate-200">${b.category}</span>
                            <span class="block text-[10px] text-slate-400">${b.note || ''}</span>
                        </div>
                        <span class="font-bold text-blue-300">${b.estimate}</span>
                    </div>
                `).join('');

                budgetCard.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div>
                            <span class="text-[11px] font-medium text-slate-400">1인 기준 총 예상 경비</span>
                            <h4 class="text-lg font-bold text-white mt-0.5">${data.budget.totalRange}</h4>
                        </div>
                        <div class="w-10 h-10 rounded-2xl bg-slate-800 flex items-center justify-center text-blue-400">
                            <i class="fa-solid fa-wallet"></i>
                        </div>
                    </div>
                    <div class="bg-slate-800/70 rounded-2xl p-3.5 space-y-1">
                        ${breakdownHtml}
                    </div>
                    <p class="text-[11px] text-slate-400 leading-relaxed">
                        <i class="fa-solid fa-circle-exclamation mr-1 text-slate-500"></i>${data.budget.note || ''}
                    </p>
                `;
                container.appendChild(budgetCard);
            }
        }

        // --- API 호출 및 일정 생성 핸들러 ---
        async function handleGeneratePlan() {
            const destInput = document.getElementById('destination').value.trim();
            if (!destInput) {
                showToast('여행지를 먼저 입력해주세요! (예: 제주도, 도쿄, 부산)', true);
                document.getElementById('destination').focus();
                return;
            }

            state.destination = destInput;
            hideToast();

            const generateBtn = document.getElementById('generate-btn');
            const loadingState = document.getElementById('loading-state');
            const resultSection = document.getElementById('result-section');

            generateBtn.disabled = true;
            generateBtn.classList.add('opacity-60');
            loadingState.classList.remove('hidden');
            resultSection.classList.add('hidden');

            try {
                const response = await fetch('/api/plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(state)
                });

                const resultData = await response.json().catch(() => ({}));

                if (!response.ok) {
                    // 서버가 여행 외 요청 등으로 명확히 거절한 경우 (400 등)
                    if (response.status === 400 && resultData.error) {
                        showToast(resultData.error, true);
                        resultSection.classList.remove('hidden');
                        return;
                    }
                    throw new Error(resultData.error || 'API 서버 응답 오류');
                }

                renderItinerary(resultData, false);
                resultSection.classList.remove('hidden');

            } catch (error) {
                // 아직 /api/plan 서버가 배포되지 않았거나 로컬 미리보기 환경인 경우 예시 일정 표시
                const mockData = getMockItinerary(
                    state.destination,
                    state.duration,
                    state.companion,
                    state.routeType,
                    state.interests
                );
                renderItinerary(mockData, true);
                resultSection.classList.remove('hidden');
                showToast('현재 미리보기 모드이므로 조건에 맞춘 예시 일정을 표시합니다. (Vercel 배포 시 실제 AI 일정이 생성됩니다)');
            } finally {
                generateBtn.disabled = false;
                generateBtn.classList.remove('opacity-60');
                loadingState.classList.add('hidden');
            }
        }

        // --- 일정 복사 기능 (iFrame 호환 execCommand 사용) ---
        document.getElementById('copy-btn').addEventListener('click', () => {
            if (!currentRenderedData) return;

            let text = `[${currentRenderedData.title}]\n${currentRenderedData.subtitle}\n\n`;
            (currentRenderedData.days || []).forEach(d => {
                text += `■ DAY ${d.day}: ${d.theme}\n`;
                (d.activities || []).forEach(a => {
                    text += `- ${a.time} ${a.title}: ${a.desc}\n`;
                });
                text += '\n';
            });

            if (currentRenderedData.mustEat) {
                text += `■ 꼭 가야 하는 핵심 맛집\n`;
                currentRenderedData.mustEat.forEach(m => {
                    text += `- ${m.name} (${m.signature}): ${m.reason}\n`;
                });
                text += '\n';
            }

            if (currentRenderedData.budget) {
                text += `■ 총 예상 경비 (1인 기준): ${currentRenderedData.budget.totalRange}\n`;
            }

            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('전체 여행 일정이 클립보드에 복사되었습니다!');
            } catch (err) {
                showToast('복사에 실패했습니다. 직접 드래그하여 복사해주세요.', true);
            }
            document.body.removeChild(textarea);
        });

        // --- 초기화 ---
        document.getElementById('generate-btn').addEventListener('click', handleGeneratePlan);

        // 첫 화면 로드 시 기본 예시 일정 렌더링
        window.addEventListener('DOMContentLoaded', () => {
            const initialData = getMockItinerary(
                state.destination,
                state.duration,
                state.companion,
                state.routeType,
                state.interests
            );
            renderItinerary(initialData, true);
        });
    </script>
</body>
</html>
