<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 여행 일정 플래너</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans KR & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        /* 스크롤바 숨기기 (모바일 가로 스크롤용) */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 부드러운 페이드인 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-800 antialiased pb-12">

    <!-- 상단 앱 바 -->
    <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-200/80 px-4 py-3.5">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-sm">
                    <i class="fa-solid fa-plane-departure text-sm"></i>
                </div>
                <h1 class="text-lg font-bold tracking-tight text-slate-900">AI 트립 플래너</h1>
            </div>
            <span class="text-xs font-medium px-2.5 py-1 bg-blue-50 text-blue-600 rounded-full border border-blue-100">
                Beta
            </span>
        </div>
    </header>

    <!-- 메인 컨테이너 (모바일 최적화 너비) -->
    <main class="max-w-md mx-auto px-4 pt-5 space-y-6">

        <!-- 입력 폼 카드 -->
        <section class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-5">
            <div>
                <h2 class="text-base font-bold text-slate-900 mb-1">어디로 떠나시나요?</h2>
                <p class="text-xs text-slate-500">조건을 입력하면 AI가 맞춤형 일정을 만들어드려요.</p>
            </div>

            <!-- 1. 여행지 입력 -->
            <div class="space-y-1.5">
                <label for="destination" class="block text-xs font-semibold text-slate-700">여행지</label>
                <div class="relative">
                    <i class="fa-solid fa-location-dot absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="destination" placeholder="예: 제주도, 도쿄, 강릉, 파리" value="제주도"
                        class="w-full pl-9 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                </div>
            </div>

            <!-- 2. 여행 기간 선택 -->
            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-slate-700">여행 기간</label>
                <div class="grid grid-cols-4 gap-2" id="duration-group">
                    <button type="button" data-value="1박 2일" class="duration-btn py-2.5 px-2 rounded-xl text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">1박 2일</button>
                    <button type="button" data-value="2박 3일" class="duration-btn py-2.5 px-2 rounded-xl text-xs font-semibold border border-blue-600 bg-blue-600 text-white shadow-sm transition-all">2박 3일</button>
                    <button type="button" data-value="3박 4일" class="duration-btn py-2.5 px-2 rounded-xl text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">3박 4일</button>
                    <button type="button" data-value="4박 5일" class="duration-btn py-2.5 px-2 rounded-xl text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">4박 5일</button>
                </div>
            </div>

            <!-- 3. 동행자 선택 -->
            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-slate-700">누구와 함께 가나요?</label>
                <div class="flex flex-wrap gap-2" id="companion-group">
                    <button type="button" data-value="혼자서" class="companion-btn px-3.5 py-2 rounded-full text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">🧍 혼자서</button>
                    <button type="button" data-value="연인과" class="companion-btn px-3.5 py-2 rounded-full text-xs font-semibold border border-blue-600 bg-blue-50 text-blue-700 transition-all">💑 연인과</button>
                    <button type="button" data-value="친구들과" class="companion-btn px-3.5 py-2 rounded-full text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">👯 친구들과</button>
                    <button type="button" data-value="부모님과" class="companion-btn px-3.5 py-2 rounded-full text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">👨‍👩‍👧 부모님과</button>
                    <button type="button" data-value="아이와" class="companion-btn px-3.5 py-2 rounded-full text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">👶 아이와</button>
                </div>
            </div>

            <!-- 4. 여행 루트 스타일 선택 -->
            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-slate-700">어떤 루트를 원하시나요?</label>
                <div class="grid grid-cols-3 gap-2" id="route-group">
                    <button type="button" data-value="가성비 루트" class="route-btn py-2.5 px-2 rounded-xl text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">💸 가성비</button>
                    <button type="button" data-value="럭셔리 루트" class="route-btn py-2.5 px-2 rounded-xl text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">✨ 럭셔리</button>
                    <button type="button" data-value="현지인 루트" class="route-btn py-2.5 px-2 rounded-xl text-xs font-semibold border border-blue-600 bg-blue-50 text-blue-700 transition-all">🧭 현지인 추천</button>
                </div>
            </div>

            <!-- 5. 관심사 (다중 선택) -->
            <div class="space-y-1.5">
                <div class="flex justify-between items-center">
                    <label class="block text-xs font-semibold text-slate-700">관심사 <span class="text-slate-400 font-normal">(중복 가능)</span></label>
                </div>
                <div class="flex flex-wrap gap-2" id="interest-group">
                    <button type="button" data-value="맛집 탐방" class="interest-btn px-3.5 py-2 rounded-full text-xs font-semibold border border-blue-600 bg-blue-50 text-blue-700 transition-all">🍽️ 맛집 탐방</button>
                    <button type="button" data-value="감성 카페" class="interest-btn px-3.5 py-2 rounded-full text-xs font-semibold border border-blue-600 bg-blue-50 text-blue-700 transition-all">☕ 감성 카페</button>
                    <button type="button" data-value="자연/힐링" class="interest-btn px-3.5 py-2 rounded-full text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">🌿 자연/힐링</button>
                    <button type="button" data-value="액티비티" class="interest-btn px-3.5 py-2 rounded-full text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">🏄 액티비티</button>
                    <button type="button" data-value="인생샷 명소" class="interest-btn px-3.5 py-2 rounded-full text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">📸 인생샷 명소</button>
                    <button type="button" data-value="문화/예술" class="interest-btn px-3.5 py-2 rounded-full text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">🎨 문화/예술</button>
                    <button type="button" data-value="쇼핑" class="interest-btn px-3.5 py-2 rounded-full text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 transition-all">🛍️ 쇼핑</button>
                </div>
            </div>

            <!-- 생성 버튼 -->
            <button type="button" id="generate-btn"
                class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold text-sm rounded-2xl shadow-md shadow-blue-600/20 flex items-center justify-center gap-2 transition-all">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>맞춤 여행 일정 만들기</span>
            </button>
        </section>

        <!-- 알림/토스트 메시지 영역 (alert 대체용) -->
        <div id="toast-message" class="hidden bg-amber-50 border border-amber-200 text-amber-800 px-4 py-3 rounded-2xl text-xs flex items-start gap-2.5 shadow-sm">
            <i class="fa-solid fa-circle-info text-amber-500 mt-0.5"></i>
            <div id="toast-text" class="leading-relaxed"></div>
        </div>

        <!-- 로딩 인디케이터 -->
        <div id="loading-state" class="hidden py-12 text-center space-y-3">
            <div class="inline-block w-10 h-10 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
            <p class="text-sm font-semibold text-slate-700">AI가 최적의 동선을 짜고 있어요...</p>
            <p class="text-xs text-slate-400">잠시만 기다려주세요 (약 3~5초 소요)</p>
        </div>

        <!-- 결과 출력 영역 (일정 카드) -->
        <section id="result-section" class="space-y-4">
            <!-- 헤더 정보 -->
            <div class="flex items-center justify-between px-1">
                <div>
                    <div class="flex items-center gap-1.5">
                        <h3 id="result-title" class="text-base font-bold text-slate-900">제주도 2박 3일 추천 일정</h3>
                        <span id="mock-badge" class="text-[10px] font-semibold px-2 py-0.5 bg-slate-200 text-slate-600 rounded-md">예시 데이터</span>
                    </div>
                    <p id="result-subtitle" class="text-xs text-slate-500 mt-0.5">연인과 함께하는 맛집 탐방 · 감성 카페 코스</p>
                </div>
                <button type="button" id="copy-btn" class="p-2 text-slate-500 hover:text-blue-600 bg-white border border-slate-200 rounded-xl shadow-sm active:scale-95 transition-all" title="일정 복사하기">
                    <i class="fa-regular fa-copy text-sm"></i>
                </button>
            </div>

            <!-- 일자별 카드 컨테이너 -->
            <div id="cards-container" class="space-y-4">
                <!-- 자바스크립트로 카드가 동적 렌더링 됩니다 -->
            </div>
        </section>

    </main>
